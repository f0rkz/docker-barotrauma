services:
  barotrauma:
    image: ghcr.io/f0rkz/docker-barotrauma:1
    restart: unless-stopped
    init: true
    env_file: ${BAROTRAUMA_ENV_FILE:-.env}
    volumes:
      - barotrauma-data:/data
      - ./config:/config/barotrauma:ro
    ports:
      - "27015:27015/udp"
      - "27016:27016/udp"
    stop_grace_period: 60s

volumes:
  barotrauma-data:
